name: Rebuild UnknownAuto v1.6 APK
on:
  push:
    branches: [unknownauto-v1-6-rebuild-20261122]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Use GitHub runner Android SDK 35
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Checkout exact upstream UnknownAuto v1.6 source
        run: |
          set -eu
          git clone https://github.com/GitMag/UnknownAuto.git UnknownAuto-src
          git -C UnknownAuto-src checkout --detach 537fe4cc1c5b9309d20916f2a77b55385edd3f8c
          test "$(git -C UnknownAuto-src rev-parse HEAD)" = 537fe4cc1c5b9309d20916f2a77b55385edd3f8c
          test "$(git -C UnknownAuto-src rev-parse refs/tags/v1.6)" = 537fe4cc1c5b9309d20916f2a77b55385edd3f8c
      - name: Build UnknownAuto v1.6 APK with new signing key
        working-directory: UnknownAuto-src
        run: bash ./build.sh
      - name: Verify signature and metadata
        shell: bash
        run: |
          set -euo pipefail
          APK=UnknownAuto-src/unknownauto.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | tee /tmp/unknownauto-badging.txt
          grep -q "package: name='com.mag.unknownauto' versionCode='7' versionName='1.6'" /tmp/unknownauto-badging.txt
          mkdir -p releases
          cp "$APK" releases/UnknownAuto-1.6-rebuilt.apk
          (cd releases && sha256sum UnknownAuto-1.6-rebuilt.apk > SHA256SUMS.txt)
      - name: Upload rebuilt APK
        uses: actions/upload-artifact@v4
        with:
          name: UnknownAuto-1.6-rebuilt-APK
          path: |
            releases/UnknownAuto-1.6-rebuilt.apk
            releases/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'UnknownAuto CI'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f releases/UnknownAuto-1.6-rebuilt.apk releases/SHA256SUMS.txt
          git commit -m 'Rebuild UnknownAuto v1.6 from original source [skip ci]'
          git push origin HEAD:unknownauto-v1-6-rebuild-20261122
