name: Build SafeAuto Lite without Shizuku
on:
  push:
    branches: [safeauto-lite-no-shizuku-20261122]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-lite-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36 using GitHub runner SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Checkout pinned upstream MIT source
        run: |
          git clone https://github.com/iAlias/AASuite.git SafeAutoLite-src
          git -C SafeAutoLite-src checkout --detach e449095fa56269c091a6bc16b08c0dad72b14bb5
          test "$(git -C SafeAutoLite-src rev-parse HEAD)" = e449095fa56269c091a6bc16b08c0dad72b14bb5
      - name: Apply SafeAuto Lite modifications
        run: python3 build_tools/patch_safeauto_lite.py SafeAutoLite-src
      - name: Compile APK
        working-directory: SafeAutoLite-src
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Validate package and privileges
        shell: bash
        run: |
          set -euo pipefail
          APK=SafeAutoLite-src/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | head -8
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump permissions "$APK" > /tmp/permissions.txt
          ! grep -Ei 'shizuku|ACCESSIBILITY|SYSTEM_ALERT_WINDOW|WRITE_SETTINGS|MEDIA_PROJECTION' /tmp/permissions.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | grep "package: name='app.safeauto.lite'"
          mkdir -p releases
          cp "$APK" releases/SafeAuto-Lite-1.0-no-Shizuku.apk
          (cd releases && sha256sum SafeAuto-Lite-1.0-no-Shizuku.apk > SHA256SUMS-Lite.txt)
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SafeAuto-Lite-1.0-APK
          path: |
            releases/SafeAuto-Lite-1.0-no-Shizuku.apk
            releases/SHA256SUMS-Lite.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK to isolated branch
        run: |
          git config user.name 'SafeAuto Lite CI'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f releases/SafeAuto-Lite-1.0-no-Shizuku.apk releases/SHA256SUMS-Lite.txt
          git commit -m 'Publish SafeAuto Lite 1.0 APK [skip ci]'
          git push origin HEAD:safeauto-lite-no-shizuku-20261122
