<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>html,body,#player{margin:0;width:100%;height:100%;background:#000}</style></head><body><div id="player"></div><script>
const videoId = new URLSearchParams(location.search).get('v') || '';
let player;
function onYouTubeIframeAPIReady(){
 if(!/^[a-zA-Z0-9_-]{11}$/.test(videoId))return;
 player=new YT.Player('player',{videoId:videoId,width:'100%',height:'100%',playerVars:{playsinline:1,autoplay:0,controls:1,origin:location.origin}});
}
window.pauseYoutube=function(){try{if(player)player.pauseVideo()}catch(e){}};
</script><script src="https://www.youtube.com/iframe_api"></script></body></html>
